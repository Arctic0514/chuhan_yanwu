  }

  function spawnParticles(x, y, color, count = 22, speed = 5) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const spd = speed * (0.4 + Math.random() * 0.9);
      state.particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 1.5,
        size: 3 + Math.random() * 5,
        color,
        life: 1.0,
        decay: 0.022 + Math.random() * 0.02
      });
    }
  }

  // 生成「砲打到變黑化灰」的隨風飄散黑灰燼粒子
  function spawnAshParticles(x, y, count = 55) {
    for (let i = 0; i < count; i++) {
      state.ashParticles.push({
        x: x + (Math.random() - 0.5) * 34,
        y: y + (Math.random() - 0.5) * 34,
        vx: (Math.random() - 0.35) * 1.6,
        vy: -0.9 - Math.random() * 2.2, // 輕飄飄向上化灰散開
        size: 2 + Math.random() * 3.8,
        shade: Math.floor(25 + Math.random() * 65),
        wobble: Math.random() * Math.PI * 2,
        life: 1.0,
        decay: 0.014 + Math.random() * 0.012
      });
    }
  }

  function spawnFloatingText(x, y, text, color = '#ffd86b', size = 24) {
    state.floatingTexts.push({
      x, y,
      text,
      color,
      size,
      vy: -1.4,
      life: 1.0,
      decay: 0.015
    });
  }

  function executeMove(move) {
    const movingPiece = state.board[move.fr][move.fc];
    const targetPiece = state.board[move.tr][move.tc];
    if (!movingPiece) return;

    state.history.push({
      board: cloneBoard(state.board),
      turn: state.turn,
      lastMove: state.lastMove ? { ...state.lastMove } : null,
      score: state.score,
      turnCount: state.turnCount,
      capturedByRed: [...state.capturedByRed],
      capturedByBlack: [...state.capturedByBlack],
      moveRecords: state.moveRecords.map(r => ({ ...r, chasedIds: [...(r.chasedIds || [])] })),
      noCaptureHalfMoves: state.noCaptureHalfMoves
    });

    const startPos = gridToPixel(move.fr, move.fc);
    const endPos = gridToPixel(move.tr, move.tc);

    state.board[move.fr][move.fc] = null;
    state.selected = null;
    state.legalMoves = [];
    state.blockedMoves = [];
    state.warningLine = null;

    if (targetPiece) {
      state.board[move.tr][move.tc] = null;
      sfx.playBattle(movingPiece.type);
      const moveNames = BATTLE_MOVES[movingPiece.type] || ['霸氣喵擊！'];
      const moveTitle = moveNames[Math.floor(Math.random() * moveNames.length)];

      // 為全部七大兵種設定專屬受擊死亡動畫類型！
      // 'K' (帥/將) -> 'ROYAL_BLAST' (金龍氣功轟成無數金色光點消散)
      // 'A' (仕/士) -> 'SLASH_SPLIT' (雙刃劍氣十字斬斷、左右錯位滑開消散)
      // 'E' (相/象) -> 'FLATTEN'     (巨象泰山壓頂踩扁成超扁紙片貼地消散)
      // 'H' (馬/傌) -> 'SKY_LAUNCH'  (戰馬鐵蹄連環踢一飛沖天化作閃亮星光)
      // 'R' (車/俥) -> 'SCREEN_FLY'  (裝甲戰車猛烈撞飛朝螢幕正面巨大化飛出)
      // 'C' (炮/包) -> 'ASH'         (防空火砲轟炸變焦黑、化成黑灰隨風飄散)
      // 'P' (兵/卒) -> 'SKEWER_FLY'  (精鋼長矛穿雲挑飛、原地高速陀螺旋轉飛出場外)
      const styleMap = {
        K: 'ROYAL_BLAST',
        A: 'SLASH_SPLIT',
        E: 'FLATTEN',
        H: 'SKY_LAUNCH',
        R: 'SCREEN_FLY',
        C: 'ASH',
        P: 'SKEWER_FLY'
      };
      const deathStyle = styleMap[movingPiece.type] || 'SKEWER_FLY';

      state.battleAnim = {
        move,
        attacker: { ...movingPiece },
        defender: { ...targetPiece },
        startX: startPos.x,
        startY: startPos.y,
        targetX: endPos.x,
        targetY: endPos.y,
        progress: 0,
        duration: 1.85, // 完整演武小劇場動畫長度（對峙 -> 蓄力出招 -> 特寫命中 -> 受擊淘汰 -> 凱旋回場）
        hitTriggered: false,
        ashSpawned: false,
        deathStyle,
        title: moveTitle,
        // 演武劇場舞台座標 (畫面中央特寫舞台)
        stageAtkX: 162,
        stageAtkY: 455,
        stageDefX: 378,
        stageDefY: 455,
        defFlyX: 378,
        defFlyY: 455,
        defScale: 2.35,
        defVx: 5.5,
        defVy: -7.5,
        defRot: 0
      };
    } else {
      sfx.playMove();
      state.moveAnim = {
        move,
        piece: { ...movingPiece },
        startX: startPos.x,
        startY: startPos.y,
        targetX: endPos.x,
        targetY: endPos.y,
        progress: 0,
        duration: 0.16
      };
    }
  }

  function finalizeMove(move, movingPiece, capturedPiece) {
    state.board[move.tr][move.tc] = movingPiece;
    state.lastMove = move;

    if (capturedPiece) {
      const pts = Math.round((PIECE_VALUES[capturedPiece.type] || 100) / 10);
      if (movingPiece.side === SIDE_RED) {
        state.capturedByRed.push(capturedPiece);
        state.score += pts * 10;
        if (state.score > state.bestScore) {
          state.bestScore = state.score;
          try { localStorage.setItem('chuhan_best_score', String(state.bestScore)); } catch (e) {}
        }
        const pos = gridToPixel(move.tr, move.tc);
        spawnFloatingText(pos.x, pos.y - 32, `+${pts * 10} 戰功`, '#ffe066', 20);
      } else {
        state.capturedByBlack.push(capturedPiece);
      }
    }

    // 更新自然限著計步器與競賽規則走棋紀錄（追蹤長將、長捉同一子、三次重複局面）
    const moverSide = movingPiece.side;
    const nextSide = moverSide === SIDE_RED ? SIDE_BLACK : SIDE_RED;
    if (capturedPiece) {
      state.noCaptureHalfMoves = 0;
    } else {
      state.noCaptureHalfMoves++;
    }

    const gaveCheck = isKingInCheck(state.board, nextSide);
    const chasedVictims = capturedPiece ? [] : getChasedVictimIds(state.board, move, moverSide);
    const chasedIds = chasedVictims.map(v => v.id);
    const hashAfter = getBoardHash(state.board, nextSide);

    state.moveRecords.push({
      side: moverSide,
      pieceId: movingPiece.id,
      fr: move.fr, fc: move.fc,
      tr: move.tr, tc: move.tc,
      wasCapture: !!capturedPiece,
      gaveCheck,
      chasedIds,
      hashAfter
    });

    // 若某方已經連續 2 次追捉同一顆棋子或連續 2 次將軍，貼心跳出「再追一步即觸犯長捉/長將禁例」提醒！
    if (!capturedPiece && state.moveRecords.length >= 3) {
      const prevSelf = state.moveRecords[state.moveRecords.length - 3];
      if (prevSelf && prevSelf.side === moverSide && !prevSelf.wasCapture) {
        if (gaveCheck && prevSelf.gaveCheck) {
          const kp = gridToPixel(move.tr, move.tc);
          spawnFloatingText(LOGICAL_W / 2, kp.y - 44, '⚡ 連續追將 (2/3)：下一步不可再原樣長將！', '#ffb703', 16);
        } else if (chasedIds.length > 0 && prevSelf.chasedIds) {
          const repeatedChase = chasedVictims.find(v => prevSelf.chasedIds.includes(v.id));
          if (repeatedChase) {
            const vLabel = PIECE_LABELS[repeatedChase.side][repeatedChase.type];
            const vp = gridToPixel(repeatedChase.r, repeatedChase.c);
            spawnFloatingText(LOGICAL_W / 2, vp.y - 44, `⚡ 長捉警告 (2/3)：已連捉【${vLabel}】兩次，下步需變著！`, '#ffb703', 16);
          }
        }
      }
    }

    // 切換回合
    state.turn = nextSide;
    if (state.turn === SIDE_RED) {
      state.turnCount++;
    }

    const inCheck = gaveCheck;
    state.inCheckSide = inCheck ? state.turn : null;

    // 【官方競賽和棋判定 1】：雙方均無可過河進攻子力（例和）
    if (isInsufficientMaterial(state.board)) {
      state.winner = 'DRAW';
      state.winReason = '雙方均無進攻子力（死局例和），握手言和！';
      sfx.playWin();
      state.screen = 'GAMEOVER';
      return;
    }

    // 【官方競賽和棋判定 2】：60 回合自然限著（連續 120 步無吃子判和）
    if (state.noCaptureHalfMoves >= 120) {
      state.winner = 'DRAW';
      state.winReason = '滿 60 回合無吃子（自然限著），依競賽規則判和！';
      sfx.playWin();
      state.screen = 'GAMEOVER';
      return;
    }

    // 【官方競賽和棋判定 3】：三次重複局面（雙方不變作和）
    const repeatCount = state.moveRecords.filter(r => r.hashAfter === hashAfter).length;
    if (repeatCount >= 3) {
      state.winner = 'DRAW';
      state.winReason = '相同局面重複達三次（雙方不變作和），判和！';
      sfx.playWin();
      state.screen = 'GAMEOVER';
      return;
    }

    const nextMoves = getAllLegalMoves(state.board, state.turn);
    if (nextMoves.length === 0) {
      state.winner = state.turn === SIDE_RED ? SIDE_BLACK : SIDE_RED;
      if (state.winner === SIDE_RED) {
        state.score += 500;
        if (state.score > state.bestScore) {
          state.bestScore = state.score;
          try { localStorage.setItem('chuhan_best_score', String(state.bestScore)); } catch (e) {}
        }
        state.winReason = inCheck ? '絕殺無解！赤虎貓軍大獲全勝！' : '玄豹貓無子可動（困斃），漢軍勝！';
        sfx.playWin();
      } else {
        state.winReason = inCheck ? '大元帥遭絕殺，玄豹貓軍獲勝！' : '赤虎貓無子可動（困斃），楚軍勝！';
        sfx.playLose();
      }
      state.screen = 'GAMEOVER';
      return;
    }

    if (inCheck) {
      sfx.playCheck();
      const kPos = findKing(state.board, state.turn);
      if (kPos) {
        const p = gridToPixel(kPos.r, kPos.c);
        spawnFloatingText(p.x, p.y - 38, '將軍！', '#ff4d4d', 30);
        spawnParticles(p.x, p.y, '#ff4d4d', 18, 4);
      }
    }

    if (state.mode === 'AI' && state.turn === SIDE_BLACK && state.screen === 'PLAYING') {
      state.aiThinking = true;
      state.aiTimer = 0.25;
    }
  }

  function handleUndo() {
    if (state.moveAnim || state.battleAnim || state.aiThinking) return;
    if (state.history.length === 0) return;

    const steps = (state.mode === 'AI' && state.history.length >= 2) ? 2 : 1;
    let snap = null;
    for (let i = 0; i < steps; i++) {
      if (state.history.length > 0) snap = state.history.pop();
    }
    if (snap) {
      state.board = snap.board;
      state.turn = snap.turn;
      state.lastMove = snap.lastMove;
      state.score = snap.score;
      state.turnCount = snap.turnCount;
      state.capturedByRed = snap.capturedByRed;
      state.capturedByBlack = snap.capturedByBlack;
      state.moveRecords = snap.moveRecords || [];
      state.noCaptureHalfMoves = snap.noCaptureHalfMoves || 0;
      state.selected = null;
      state.legalMoves = [];
      state.inCheckSide = isKingInCheck(state.board, state.turn) ? state.turn : null;
      sfx.playSelect();
    }
  }

  // =========================================================================
  // 5. 寫實風格 3D 貓咪武將繪製引擎 (真實比例貓臉、毛髮紋理、金屬裝甲與兵器)
  // =========================================================================
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 跨平台像素級精準置中繪字（解決 iOS Safari WebKit Canvas 遇見 Emoji 時 textAlign='center' 向右偏移的 Bug！）
  function drawCenteredText(ctx, text, cx, cy, maxW = null) {
    ctx.save();
    ctx.direction = 'ltr';
    ctx.textAlign = 'left';
    const rawW = ctx.measureText(text).width;
    const drawW = maxW ? Math.min(maxW, rawW) : rawW;
    const startX = cx - drawW / 2;
    if (maxW) {
      ctx.fillText(text, startX, cy, maxW);
    } else {
      ctx.fillText(text, startX, cy);
    }
    ctx.restore();
  }

  function drawButton(btn) {
    state.uiButtons.push(btn);
    ctx.save();
    roundRect(ctx, btn.x, btn.y, btn.w, btn.h, btn.r || 12);
    const grad = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
    grad.addColorStop(0, btn.bg1 || '#8b261d');
    grad.addColorStop(1, btn.bg2 || '#59130d');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = btn.border || '#e8b960';
    ctx.stroke();

    ctx.fillStyle = btn.color || '#fff3d6';
    ctx.font = `bold ${btn.fontSize || 20}px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif`;
    ctx.textBaseline = 'middle';
    drawCenteredText(ctx, btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 1, btn.w - 16);
    ctx.restore();
  }

  // 繪製圖片同款畫風：3D 軟萌蓬鬆二頭身橘白虎斑貓（笑瞇瞇彎月眼、張嘴粉紅舌頭、蓬鬆白臉頰、厚針織圍巾與國風武俠外褂）！
  function drawRealisticCatHead(ctx, cx, cy, r, isRed, angry = false, charred = 0) {
    ctx.save();

    // 1. 配色設定：紅方為「暖橘白虎斑貓」，黑方為「銀灰黑虎斑貓」
    const furTopColor  = charred > 0.5 ? '#363432' : (isRed ? '#de8747' : '#525b66');
    const furDarkStripe = charred > 0.5 ? '#1c1b1a' : (isRed ? '#b35c20' : '#2a3038');
    const earInnerPink = charred > 0.5 ? '#474240' : (isRed ? '#eb9b8f' : '#9c848a');
    const earFluffWhite = charred > 0.5 ? '#555250' : '#fffcf7';

    // 2. 兩側大而蓬鬆的立體貓耳 (略往外張，帶粉嫩耳窩與白色耳簇毛)
    [-1, 1].forEach(dir => {
      ctx.save();
      // 外耳廓 (暖橘/銀灰立體漸層)
      ctx.fillStyle = furTopColor;
      ctx.beginPath();
      ctx.moveTo(cx + dir * r * 0.42, cy - r * 0.62);
      ctx.quadraticCurveTo(cx + dir * r * 0.98, cy - r * 1.15, cx + dir * r * 1.12, cy - r * 0.92);
      ctx.quadraticCurveTo(cx + dir * r * 1.16, cy - r * 0.35, cx + dir * r * 0.88, cy - r * 0.08);
      ctx.closePath();
      ctx.fill();

      // 耳朵邊緣柔和立體暗面
      ctx.strokeStyle = furDarkStripe;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 粉嫩內耳窩
      ctx.fillStyle = earInnerPink;
      ctx.beginPath();
      ctx.moveTo(cx + dir * r * 0.55, cy - r * 0.54);
      ctx.quadraticCurveTo(cx + dir * r * 0.92, cy - r * 0.94, cx + dir * r * 1.00, cy - r * 0.78);
      ctx.quadraticCurveTo(cx + dir * r * 0.98, cy - r * 0.36, cx + dir * r * 0.78, cy - r * 0.18);
      ctx.closePath();
      ctx.fill();

      // 耳道口蓬鬆白色耳毛簇 (圖片招牌細節！)
      ctx.fillStyle = earFluffWhite;
      ctx.beginPath();
      ctx.moveTo(cx + dir * r * 0.52, cy - r * 0.32);
      ctx.lineTo(cx + dir * r * 0.82, cy - r * 0.52);
      ctx.lineTo(cx + dir * r * 0.74, cy - r * 0.34);
      ctx.lineTo(cx + dir * r * 0.88, cy - r * 0.36);
      ctx.lineTo(cx + dir * r * 0.68, cy - r * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // 3. 超寬圓蓬鬆包子臉 (下顎與雙頰極度圓潤飽滿，寬高比約 1.25 : 0.92)
    const rx = r * 1.22;
    const ry = r * 0.92;

    // 臉部底部柔和立體陰影
    ctx.beginPath();
    ctx.ellipse(cx, cy + 1.8, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = charred > 0.5 ? '#121110' : 'rgba(95, 52, 24, 0.32)';
    ctx.fill();

    // 臉部奶油白絨毛主體 (3D 柔光球體漸層)
    const faceGrad = ctx.createRadialGradient(
      cx, cy - ry * 0.15, r * 0.15,
      cx, cy + ry * 0.1, rx * 1.08
    );
    if (charred > 0.5) {
      faceGrad.addColorStop(0, '#524f4d');
      faceGrad.addColorStop(0.7, '#2b2927');
      faceGrad.addColorStop(1, '#171615');
    } else if (isRed) {
      faceGrad.addColorStop(0, '#ffffff');
      faceGrad.addColorStop(0.68, '#fff7eb');
      faceGrad.addColorStop(1, '#edd5bc');
    } else {
      faceGrad.addColorStop(0, '#f5f7fa');
      faceGrad.addColorStop(0.68, '#dce2e8');
      faceGrad.addColorStop(1, '#b0bac4');
    }

    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = faceGrad;
    ctx.fill();

    // 4. 額頭八字分開的橘色/深灰虎斑塊 + 臉頰兩側雙橫紋 (完全還原圖片花紋！)
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    // 左右額頭大片虎斑底色 (中間留出白色倒 V 鼻梁線)
    ctx.fillStyle = furTopColor;
    [-1, 1].forEach(dir => {
      ctx.beginPath();
      ctx.moveTo(cx + dir * r * 0.08, cy - ry * 1.05);
      ctx.quadraticCurveTo(cx + dir * rx * 0.85, cy - ry * 0.95, cx + dir * rx * 1.05, cy - ry * 0.12);
      ctx.quadraticCurveTo(cx + dir * rx * 0.55, cy - ry * 0.25, cx + dir * r * 0.14, cy - ry * 0.42);
      ctx.closePath();
      ctx.fill();

      // 額頭深色虎斑紋條
      ctx.fillStyle = furDarkStripe;
      ctx.beginPath();
      ctx.ellipse(cx + dir * r * 0.42, cy - ry * 0.65, r * 0.11, r * 0.32, dir * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + dir * r * 0.72, cy - ry * 0.48, r * 0.09, r * 0.26, dir * 0.55, 0, Math.PI * 2);
      ctx.fill();

      // 臉頰鼓起處的兩道可愛虎斑紋 (圖片精髓！)
      ctx.fillStyle = furTopColor;
      ctx.beginPath();
      ctx.ellipse(cx + dir * rx * 0.76, cy + ry * 0.14, r * 0.22, r * 0.075, dir * -0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + dir * rx * 0.68, cy + ry * 0.34, r * 0.17, r * 0.068, dir * -0.12, 0, Math.PI * 2);
      ctx.fill();
    });

    // 臉頰粉嫩紅暈
    if (charred <= 0.5) {
      ctx.fillStyle = isRed ? 'rgba(255, 138, 115, 0.36)' : 'rgba(235, 145, 165, 0.28)';
      ctx.beginPath();
      ctx.ellipse(cx - rx * 0.52, cy + ry * 0.12, r * 0.24, r * 0.14, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + rx * 0.52, cy + ry * 0.12, r * 0.24, r * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 5. 圖片招牌表情：開懷笑瞇瞇彎月眼 `^ ^`！
    const eyeY = cy - ry * 0.06;
    const eyeX = rx * 0.40;
    ctx.strokeStyle = charred > 0.5 ? '#111111' : '#2b1911';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';

    [-1, 1].forEach(dir => {
      const ex = cx + dir * eyeX;
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.24, eyeY + dir * r * 0.03);
      ctx.quadraticCurveTo(ex, eyeY - r * 0.22, ex + r * 0.24, eyeY - dir * r * 0.01);
      ctx.stroke();

      // 眼尾小睫毛分岔
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(ex + dir * r * 0.18, eyeY - r * 0.04);
      ctx.lineTo(ex + dir * r * 0.29, eyeY - r * 0.10);
      ctx.stroke();
      ctx.lineWidth = 2.5;
    });

    // 6. 精緻粉紅小倒三角鼻 + 開懷大笑張開的貓嘴與粉嫩舌頭 (完全還原圖片中心表情！)
    const noseY = cy + ry * 0.02;
    ctx.fillStyle = charred > 0.5 ? '#262626' : '#f28b82';
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.11, noseY - r * 0.04);
    ctx.lineTo(cx + r * 0.11, noseY - r * 0.04);
    ctx.lineTo(cx, noseY + r * 0.06);
    ctx.closePath();
    ctx.fill();

    // 張開的開心大嘴巴 (上唇 M 字貓嘴弧線 + 下唇深U型口腔)
    const mouthTopY = noseY + r * 0.07;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.30, mouthTopY + r * 0.04);
    ctx.quadraticCurveTo(cx - r * 0.12, mouthTopY - r * 0.03, cx, mouthTopY + r * 0.02);
    ctx.quadraticCurveTo(cx + r * 0.12, mouthTopY - r * 0.03, cx + r * 0.30, mouthTopY + r * 0.04);
    ctx.quadraticCurveTo(cx + r * 0.28, mouthTopY + r * 0.54, cx, mouthTopY + r * 0.56);
    ctx.quadraticCurveTo(cx - r * 0.28, mouthTopY + r * 0.54, cx - r * 0.30, mouthTopY + r * 0.04);
    ctx.closePath();

    // 口腔內部深紅褐色陰影
    ctx.fillStyle = charred > 0.5 ? '#1a1a1a' : '#7a2e28';
    ctx.fill();

    // 裁切出口腔內的大片粉嫩圓舌頭！
    ctx.clip();
    ctx.fillStyle = charred > 0.5 ? '#404040' : '#f28b82';
    ctx.beginPath();
    ctx.ellipse(cx, mouthTopY + r * 0.42, r * 0.26, r * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    // 舌頭底部高光邊緣
    ctx.strokeStyle = charred > 0.5 ? '#555' : '#ffb8b0';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();

    // 嘴角上揚加深描線
    ctx.strokeStyle = charred > 0.5 ? '#1a1a1a' : '#59221c';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.32, mouthTopY + r * 0.05);
    ctx.quadraticCurveTo(cx - r * 0.12, mouthTopY - r * 0.03, cx, mouthTopY + r * 0.02);
    ctx.quadraticCurveTo(cx + r * 0.12, mouthTopY - r * 0.03, cx + r * 0.32, mouthTopY + r * 0.05);
    ctx.stroke();

    // 7. 兩側輕盈向外彎曲的細長鬍鬚
    ctx.strokeStyle = charred > 0.5 ? '#444' : (isRed ? '#b87648' : '#7c8794');
    ctx.lineWidth = 1.0;
    [-1, 1].forEach(dir => {
      ctx.beginPath();
      ctx.moveTo(cx + dir * rx * 0.48, cy + ry * 0.08);
      ctx.quadraticCurveTo(cx + dir * rx * 0.88, cy + ry * 0.02, cx + dir * rx * 1.18, cy + ry * 0.12);
      ctx.moveTo(cx + dir * rx * 0.50, cy + ry * 0.20);
      ctx.quadraticCurveTo(cx + dir * rx * 0.88, cy + ry * 0.20, cx + dir * rx * 1.15, cy + ry * 0.30);
      ctx.stroke();
    });

    ctx.restore();
  }

  // 繪製圖片同款「二頭身蓬鬆大圍巾 + 國風刺繡外褂 + 虎斑條紋圓尾巴 + 白毛球手腳」全身基底公仔！
  function drawChibiCatBody(ctx, cx, cy, isRed, charred = 0, raiseArms = true) {
    ctx.save();
    ctx.translate(cx, cy);

    const scarfMain = charred > 0.5 ? '#33302e' : (isRed ? '#d9623b' : '#3b6e8c');
    const scarfDark = charred > 0.5 ? '#1c1a19' : (isRed ? '#a63f1e' : '#23465c');
    const coatCream = charred > 0.5 ? '#454240' : (isRed ? '#f7ead9' : '#d8e0e8');
    const coatBrok  = charred > 0.5 ? '#262423' : (isRed ? '#593e31' : '#2b333d');
    const pantsNavy = charred > 0.5 ? '#171615' : (isRed ? '#282c37' : '#181c24');
    const pawWhite  = charred > 0.5 ? '#4a4745' : '#fffbf5';
    const tailBase  = charred > 0.5 ? '#2e2b29' : (isRed ? '#c97236' : '#4a525d');

    // 1. 左側高高翹起的粗圓條紋尾巴 (完全對應圖片左方白尖條紋尾巴！)
    ctx.save();
    ctx.lineCap = 'round';
    // 尾巴主幹
    ctx.strokeStyle = tailBase;
    ctx.lineWidth = 6.8;
    ctx.beginPath();
    ctx.moveTo(-9, 13);
    ctx.quadraticCurveTo(-22, 12, -20, -2);
    ctx.stroke();

    // 尾巴中段白色毛環与末端白毛尖
    ctx.strokeStyle = pawWhite;
    ctx.lineWidth = 6.8;
    ctx.beginPath();
    ctx.moveTo(-20.2, 5);
    ctx.lineTo(-20.5, 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-20, -3, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = pawWhite;
    ctx.fill();
    ctx.restore();

    // 2. 兩隻圓滾滾白色短胖腳掌 (站在棋盤上)
    ctx.fillStyle = pawWhite;
    ctx.beginPath();
    ctx.ellipse(-7.5, 19, 5.2, 3.4, 0, 0, Math.PI * 2);
    ctx.ellipse(7.5, 19, 5.2, 3.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // 3. 深藍灰色燈籠短褲 (圖片同款寬鬆下擺)
    ctx.fillStyle = pantsNavy;
    roundRect(ctx, -12.5, 11, 12, 7.5, 3);
    ctx.fill();
    roundRect(ctx, 0.5, 11, 12, 7.5, 3);
    ctx.fill();
    // 褲管格紋滾邊
    ctx.fillStyle = '#7a6248';
    ctx.fillRect(-12, 16, 11, 2);
    ctx.fillRect(1, 16, 11, 2);

    // 4. 肚皮與編織紅腰帶 + 白色小珠串配飾 (圖片胸腹細節！)
    ctx.fillStyle = pawWhite;
    roundRect(ctx, -8, 4, 16, 9, 4);
    ctx.fill();

    // 暖橘紅編織腰帶與流蘇垂墜
    ctx.fillStyle = scarfMain;
    roundRect(ctx, -9, 9.5, 18, 3.2, 1.5);
    ctx.fill();
    ctx.fillRect(-1.2, 10, 2.4, 6.5);

    // 胸前白色小念珠鍊
    ctx.fillStyle = '#fffdf9';
    [-4, -2, 0, 2, 4].forEach((bx, idx) => {
      ctx.beginPath();
      ctx.arc(bx, 6.5 + (idx % 2 === 1 ? 1.2 : 0), 1.1, 0, Math.PI * 2);
      ctx.fill();
    });

    // 5. 兩側國風刺繡外褂背心 (左邊奶油白刺繡翻領 + 咖啡棕袖口)
    ctx.fillStyle = coatBrok;
    roundRect(ctx, -14, 2, 7, 12, 2.5);
    ctx.fill();
    roundRect(ctx, 7, 2, 7, 12, 2.5);
    ctx.fill();

    // 左側奶油白外褂斜片
    ctx.fillStyle = coatCream;
    ctx.beginPath();
    ctx.moveTo(-13.5, 3);
    ctx.lineTo(-5.5, 3);
    ctx.lineTo(-7.5, 13.5);
    ctx.lineTo(-14, 13.5);
    ctx.closePath();
    ctx.fill();

    // 6. 雙手高舉歡呼的圓滾滾白肉球小手 (圖片招牌動作！)
    if (raiseArms) {
      [-1, 1].forEach(dir => {
        ctx.save();
        ctx.translate(dir * 13.5, 4);
        ctx.rotate(dir * -0.45);
        // 棕色外褂寬袖
        ctx.fillStyle = coatBrok;
        roundRect(ctx, -4, -6, 8, 7, 2.5);
        ctx.fill();
        // 圓滾滾白色毛絨手掌
        ctx.fillStyle = pawWhite;
        ctx.beginPath();
        ctx.arc(0, -7.5, 4.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // 7. 脖子上厚實蓬鬆的針織大圍巾 + 右側垂下的印花圍巾尾端！
    const scarfGrad = ctx.createLinearGradient(-12, 0, 12, 6);
    scarfGrad.addColorStop(0, scarfMain);
    scarfGrad.addColorStop(1, scarfDark);
    ctx.fillStyle = scarfGrad;
    roundRect(ctx, -12.5, 0, 25, 6.5, 3.2);
    ctx.fill();

    // 圍巾右側垂掛尾段与淺色流蘇邊
    ctx.fillStyle = scarfMain;
    ctx.beginPath();
    ctx.moveTo(5, 3);
    ctx.lineTo(11.5, 3);
    ctx.lineTo(13, 14.5);
    ctx.lineTo(6.5, 14.5);
    ctx.closePath();
    ctx.fill();

    // 圍巾尾端小花紋與白流蘇
    ctx.fillStyle = '#f7d6c4';
    ctx.beginPath();
    ctx.arc(9.5, 10, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(6.8, 13.5, 6, 2);

    ctx.restore();
  }

  // 繪製七大兵種：以圖片同款「3D 軟萌圍巾國風橘白貓」為主角，搭配各兵種專屬萌系武俠裝備！
  function draw3DCatModel(ctx, type, isRed, charred = 0) {
    const accentGold = charred > 0.5 ? '#55524f' : '#f5be4f';
    const woodDark   = charred > 0.5 ? '#262422' : '#78492a';
    const woodLight  = charred > 0.5 ? '#403d3a' : '#d49b6a';

    if (type === 'R') {
      // 【車 / 俥】：軟萌圍巾貓開著國風木甲小戰車歡呼！
      drawChibiCatBody(ctx, 0, -2, isRed, charred, true);
      drawRealisticCatHead(ctx, 0, -9, 12.2, isRed, false, charred);

      // 下方精緻國風木甲小戰車底盤與金輪
      const carGrad = ctx.createLinearGradient(0, 8, 0, 19);
      carGrad.addColorStop(0, isRed ? '#d9623b' : '#3b6e8c');
      carGrad.addColorStop(1, isRed ? '#8f3415' : '#1f3f54');
      roundRect(ctx, -20, 8, 40, 10, 5);
      ctx.fillStyle = carGrad;
      ctx.fill();

      roundRect(ctx, -16, 10, 32, 3, 1.5);
      ctx.fillStyle = woodLight;
      ctx.fill();

      [-11, 11].forEach(wx => {
        ctx.beginPath();
        ctx.arc(wx, 18, 5.2, 0, Math.PI * 2);
        ctx.fillStyle = '#2b2623';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(wx, 18, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = accentGold;
        ctx.fill();
      });

    } else if (type === 'C') {
      // 【炮 / 包】：軟萌圍巾貓拖著虎頭小火砲開心出擊！
      // 左側虎頭小火砲
      ctx.save();
      ctx.translate(-14, 9);
      ctx.rotate(-0.55);
      roundRect(ctx, -4.5, -19, 9, 20, 3.5);
      ctx.fillStyle = charred > 0.5 ? '#2b2b2b' : '#4a5561';
      ctx.fill();
      // 金色砲口環
      roundRect(ctx, -5.5, -21, 11, 4, 2);
      ctx.fillStyle = accentGold;
      ctx.fill();
      ctx.restore();

      // 砲車木輪
      ctx.beginPath();
      ctx.arc(-14, 16.5, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = woodDark;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-14, 16.5, 2.3, 0, Math.PI * 2);
      ctx.fillStyle = accentGold;
      ctx.fill();

      // 右側軟萌圍巾貓主體
      drawChibiCatBody(ctx, 5, 0, isRed, charred, true);
      drawRealisticCatHead(ctx, 5, -7, 11.8, isRed, false, charred);

    } else if (type === 'H') {
      // 【馬 / 傌】：軟萌圍巾貓騎在毛絨小戰馬上笑瞇瞇衝鋒！
      // 小戰馬圓滾滾身軀與四腳
      ctx.fillStyle = woodDark;
      roundRect(ctx, -13, 12, 4, 7.5, 2);
      ctx.fill();
      roundRect(ctx, 9, 12, 4, 7.5, 2);
      ctx.fill();

      roundRect(ctx, -15, 5, 29, 9.5, 4.8);
      ctx.fillStyle = woodLight;
      ctx.fill();

      // 小馬頭 (右側)
      ctx.beginPath();
      ctx.ellipse(14, 2, 5, 7.5, 0.3, 0, Math.PI * 2);
      ctx.fillStyle = woodLight;
      ctx.fill();

      // 騎在馬背上的軟萌圍巾貓
      drawChibiCatBody(ctx, -1, -3, isRed, charred, true);
      drawRealisticCatHead(ctx, -1, -10, 11.8, isRed, false, charred);

    } else if (type === 'E') {
      // 【相 / 象】：軟萌圍巾貓騎在圓滾滾奶油灰小象背上！
      const eleColor = charred > 0.5 ? '#363636' : '#96a6b0';
      roundRect(ctx, -15, 5, 30, 12, 6);
      ctx.fillStyle = eleColor;
      ctx.fill();

      // 小象捲鼻與大耳朵
      ctx.beginPath();
      ctx.arc(13, 7, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = eleColor;
      ctx.lineWidth = 3.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(17, 8);
      ctx.quadraticCurveTo(22, 12, 18, 16);
      ctx.stroke();

      drawChibiCatBody(ctx, -1, -3, isRed, charred, true);
      drawRealisticCatHead(ctx, -1, -10, 11.8, isRed, false, charred);

    } else if (type === 'A') {
      // 【仕 / 士】：軟萌圍巾貓背著雙把古風木劍 + 飄揚小音符/愛心氣場！
      // 背後交叉雙劍
      ctx.strokeStyle = woodLight;
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-17, -15); ctx.lineTo(17, 15);
      ctx.moveTo(17, -15); ctx.lineTo(-17, 15);
      ctx.stroke();

      drawChibiCatBody(ctx, 0, 0, isRed, charred, true);
      drawRealisticCatHead(ctx, 0, -7, 12.4, isRed, false, charred);

    } else if (type === 'K') {
      // 【帥 / 將】：頭戴精緻小金冠、身披紅圍巾與國風外褂的貓咪總帥！
      drawChibiCatBody(ctx, 0, 0, isRed, charred, true);
      drawRealisticCatHead(ctx, 0, -7, 12.8, isRed, false, charred);

      // 頭頂圓潤精緻小金冠
      ctx.fillStyle = accentGold;
      ctx.beginPath();
      ctx.moveTo(-7, -18);
      ctx.lineTo(-8, -25);
      ctx.lineTo(-3, -21);
      ctx.lineTo(0, -27);
      ctx.lineTo(3, -21);
      ctx.lineTo(8, -25);
      ctx.lineTo(7, -18);
      ctx.closePath();
      ctx.fill();

    } else {
      // 【兵 / 卒】：100% 原汁原味圖片同款「軟萌圍巾國風橘白貓」+ 身旁飄浮小愛心與小音符 + 手持小紅纓木槍！
      drawChibiCatBody(ctx, 0, 0, isRed, charred, true);
      drawRealisticCatHead(ctx, 0, -7, 12.4, isRed, false, charred);

      // 圖片同款：臉頰兩側飄浮的暖橘小愛心與小音符 ♪！
      if (charred <= 0.5) {
        ctx.fillStyle = isRed ? '#e07a3c' : '#5c92b8';
        // 左側小愛心
        ctx.beginPath();
        ctx.arc(-18, -3, 2.2, 0, Math.PI * 2);
        ctx.arc(-15.5, -4.2, 2.2, 0, Math.PI * 2);
        ctx.lineTo(-17.8, 0.5);
        ctx.closePath();
        ctx.fill();

        // 右側小音符 ♪
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('♪', 16, -2);
      }

      // 右側背著小巧紅纓槍
      ctx.strokeStyle = woodDark;
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(14, 17);
      ctx.lineTo(14, -14);
      ctx.stroke();
      if (charred <= 0.5) {
        ctx.fillStyle = '#d94832';
        ctx.beginPath();
        ctx.arc(14, -13, 2.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 直接渲染 3D 軟萌二頭身圍巾貓作為棋子 (附帶清晰小圓章標記)
  function drawPiece(x, y, piece, scale = 1, alpha = 1, rotation = 0, isSelected = false, charred = 0) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(scale, scale);

    const isRed = piece.side === SIDE_RED;

    // 1. 選中時腳下展開暖金/冰藍柔和光環
    if (isSelected) {
      const pulse = 1 + Math.sin(state.animClock * 7) * 0.06;
      ctx.save();
      ctx.scale(pulse, pulse);
      ctx.beginPath();
      ctx.ellipse(0, 18, 24, 10.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 245, 215, 0.72)';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = isRed ? '#e06b3c' : '#3b7ea1';
      ctx.stroke();
      ctx.restore();
    }

    // 2. 腳掌踩在木棋盤上的柔和接觸陰影
    if (charred < 0.7) {
      ctx.beginPath();
      ctx.ellipse(0, 19.5, 17, 6.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(80, 50, 25, 0.30)';
      ctx.fill();
    }

    // 3. 選中時開心地上下輕快彈跳
    const bounceY = isSelected ? (-4.5 + Math.sin(state.animClock * 8) * 2.2) : 0;
    ctx.translate(0, bounceY);

    // 4. 繪製圖片同款 3D 軟萌二頭身圍巾貓本體
    draw3DCatModel(ctx, piece.type, isRed, charred);

    // 5. 右下角精緻兵種小圓章
    if (charred < 0.6) {
      const tagX = 16.5;
      const tagY = 14.5;
      ctx.save();
      ctx.beginPath();
      ctx.arc(tagX, tagY + 1.2, 8.8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(50, 30, 15, 0.28)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(tagX, tagY, 8.8, 0, Math.PI * 2);
      ctx.fillStyle = isRed ? '#c94a29' : '#283c4f';
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = '#fff8eb';
      ctx.stroke();

      const label = PIECE_LABELS[piece.side][piece.type];
      ctx.fillStyle = '#fff8eb';
      ctx.font = 'bold 11.5px "PingFang TC", "Microsoft JhengHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, tagX, tagY + 0.5);
      ctx.restore();
    }

    ctx.restore();
  }

  // 繪製像《決戰中國象棋》影片一樣的「吃子專屬演武小劇場動畫」！
  function renderBattleCutscene(b) {
    const t = b.progress;
    const isRedAtk = b.attacker.side === SIDE_RED;
    const mainColor = isRedAtk ? '#ff4d36' : '#38b6ff';
    const subColor = '#ffe066';

    // 計算劇場展開與收合透明度 (前 12% 展開，後 12% 收合回棋盤)
    let openAlpha = 1.0;
    if (t < 0.12) openAlpha = t / 0.12;
    else if (t > 0.88) openAlpha = Math.max(0, (1 - t) / 0.12);

    ctx.save();

    // 1. 全畫面暗化聚光背景
    ctx.fillStyle = `rgba(10, 5, 2, ${0.78 * openAlpha})`;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    // 2. 演武小劇場舞台外框 (y: 230 ~ 660)
    const stageX = 24, stageY = 230, stageW = LOGICAL_W - 48, stageH = 430;
    ctx.save();
    ctx.globalAlpha = openAlpha;

    // 舞台陰影與金邊卷軸框
    roundRect(ctx, stageX, stageY, stageW, stageH, 20);
    const stageGrad = ctx.createLinearGradient(0, stageY, 0, stageY + stageH);
    stageGrad.addColorStop(0, '#2c1910');
    stageGrad.addColorStop(0.58, '#4a2b18');
    stageGrad.addColorStop(0.60, '#8c5830');
    stageGrad.addColorStop(1, '#523218');
    ctx.fillStyle = stageGrad;
    ctx.fill();

    // 舞台內部裁切區 (讓背景速度線與地面裂紋保持在框內)
    ctx.save();
    roundRect(ctx, stageX + 4, stageY + 4, stageW - 8, stageH - 8, 16);
    ctx.clip();

    // 天空動感對決背景光束 / 速度線
    ctx.strokeStyle = isRedAtk ? 'rgba(255, 110, 60, 0.16)' : 'rgba(70, 175, 255, 0.16)';
    ctx.lineWidth = 4;
    for (let i = 0; i < 14; i++) {
      const ly = stageY + 20 + i * 22;
      const offset = ((t * 900 + i * 73) % 260) - 130;
      ctx.beginPath();
      ctx.moveTo(stageX + offset, ly);
      ctx.lineTo(stageX + stageW + offset, ly - 18);
      ctx.stroke();
    }

    // 遠山剪影與演武場地面
    ctx.fillStyle = 'rgba(20, 10, 5, 0.55)';
    ctx.beginPath();
    ctx.moveTo(stageX, stageY + 265);
    ctx.lineTo(stageX + 110, stageY + 195);
    ctx.lineTo(stageX + 230, stageY + 245);
    ctx.lineTo(stageX + 370, stageY + 180);
    ctx.lineTo(stageX + stageW, stageY + 265);
    ctx.closePath();
    ctx.fill();

    // 演武場石板地面與透視格線
    const floorTop = stageY + 265;
    const floorGrad = ctx.createLinearGradient(0, floorTop, 0, stageY + stageH);
    floorGrad.addColorStop(0, '#a67442');
    floorGrad.addColorStop(1, '#5e3c1b');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(stageX, floorTop, stageW, stageH - 265);

    ctx.strokeStyle = 'rgba(55, 30, 12, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(stageX, floorTop);
    ctx.lineTo(stageX + stageW, floorTop);
    for (let i = -3; i <= 3; i++) {
      ctx.moveTo(LOGICAL_W / 2 + i * 55, floorTop);
      ctx.lineTo(LOGICAL_W / 2 + i * 115, stageY + stageH);
    }
    ctx.stroke();

    // 頂部雙方武將對決名條 (VS Banner)
    ctx.fillStyle = 'rgba(22, 11, 5, 0.88)';
    ctx.fillRect(stageX, stageY, stageW, 54);
    ctx.strokeStyle = '#d4a253';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(stageX, stageY + 54);
    ctx.lineTo(stageX + stageW, stageY + 54);
    ctx.stroke();

    const atkTitle = `【${PIECE_LABELS[b.attacker.side][b.attacker.type]}】${PIECE_TITLES[b.attacker.type]}`;
    const defTitle = `【${PIECE_LABELS[b.defender.side][b.defender.type]}】${PIECE_TITLES[b.defender.type]}`;
    ctx.font = 'bold 15px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = b.attacker.side === SIDE_RED ? '#ff9478' : '#80caff';
    ctx.fillText(atkTitle, stageX + 16, stageY + 27, 195);

    ctx.textAlign = 'right';
    ctx.fillStyle = b.defender.side === SIDE_RED ? '#ff9478' : '#80caff';
    ctx.fillText(defTitle, stageX + stageW - 16, stageY + 27, 195);

    ctx.textAlign = 'center';
    ctx.font = 'italic bold 22px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillStyle = '#ffd866';
    ctx.fillText('VS', LOGICAL_W / 2, stageY + 28);

    // 3. 計算舞台上攻擊方 (左側) 與防守方 (右側) 的劇院級動作演出！
    // 時間軸：
    // 0.00 ~ 0.24: 雙方登場對峙、蓄力震動
    // 0.24 ~ 0.44: 攻擊方發動專屬絕招衝刺/開火/跳躍
    // 0.44: 命中瞬間！(閃白光 + 震動 + 粒子爆發)
    // 0.44 ~ 0.90: 防守方呈現專屬敗北動畫 (化灰、飛向螢幕、劈開、壓成紙片、踢上天化星、挑飛)
    const baseAtkX = 148, baseAtkY = 472;
    const baseDefX = 392, baseDefY = 472;
    const modelScale = 2.35; // 放大 2.35 倍特寫！

    let atkX = baseAtkX, atkY = baseAtkY, atkRot = 0, atkScale = modelScale;
    const type = b.attacker.type;

    if (t < 0.24) {
      // 登場與蓄力
      const p = t / 0.24;
      atkX = baseAtkX - (1 - p) * 70 + Math.sin(p * 30) * 3;
      atkScale = modelScale * (0.9 + p * 0.15);
    } else if (t < 0.44) {
      // 出招衝刺階段
      const p = (t - 0.24) / 0.20;
      if (type === 'C') {
        // 防空砲：後座力震退並仰角開火
        atkX = baseAtkX - Math.sin(p * Math.PI) * 18;
        atkRot = -Math.sin(p * Math.PI) * 0.12;
      } else if (type === 'K') {
        // 大元帥：原地浮空蓄氣推掌
        atkY = baseAtkY - Math.sin(p * Math.PI) * 26;
        atkScale = modelScale * (1.05 + p * 0.2);
      } else if (type === 'E') {
        // 戰象：站定左側原地高高昂起頭，前傾伸長象鼻準備噴出洶湧洪水！
        atkX = baseAtkX + Math.sin(p * Math.PI) * 18;
        atkY = baseAtkY - Math.sin(p * Math.PI) * 10;
        atkRot = -Math.sin(p * Math.PI) * 0.18;
        atkScale = modelScale * (1.06 + Math.sin(p * Math.PI) * 0.16);
      } else if (type === 'H') {
        // 騎兵：快速衝近敵方並轉身前傾「尥蹶子」，向後伸出長長的馬腿猛踢敵人！
        atkX = baseAtkX + (baseDefX - baseAtkX - 92) * Math.min(1, p * 1.4);
        atkY = baseAtkY - Math.sin(p * Math.PI) * 14;
        atkRot = p > 0.35 ? ((p - 0.35) / 0.65) * 0.38 : 0.08; // 身體前傾，後方馬腿高高踢出！
      } else if (type === 'R') {
        // 戰車：全速狂飆衝撞
        atkX = baseAtkX + (baseDefX - baseAtkX - 25) * (p * p);
      } else {
        // 仕/兵：疾風突刺衝鋒
        atkX = baseAtkX + (baseDefX - baseAtkX - 35) * p;
        atkY = baseAtkY - Math.sin(p * Math.PI) * 25;
      }
    } else {
      // 命中後收招英姿
      const p = Math.min(1, (t - 0.44) / 0.45);
      if (type === 'C' || type === 'K' || type === 'E') {
        // 戰象、火砲、大元帥皆霸氣鎮守原位施展遠程/天降絕學！
        atkX = baseAtkX;
        atkY = baseAtkY;
      } else {
        atkX = baseDefX - 65;
        atkY = baseDefY;
      }
    }

    // 4. 繪製防守方 (依 7 大兵種死亡演出呈現劇院級效果)
    if (t < 0.44) {
      // 命中前：防守方驚慌顫抖
      const panicShake = t > 0.24 ? Math.sin(t * 95) * 5 : 0;
      drawPiece(baseDefX + panicShake, baseDefY, b.defender, modelScale, 1.0, 0, false, 0);
    } else {
      const dp = Math.min(1, (t - 0.44) / 0.48);
      if (b.deathStyle === 'ASH') {
        // 【砲擊】：先被炸成全身焦黑炭化並劇烈抽動 -> 接著崩解化成黑灰隨風飄散！
        const shake = (1 - dp) * Math.sin(t * 90) * 7;
        const fadeAlpha = dp < 0.35 ? 1.0 : Math.max(0, 1 - (dp - 0.35) / 0.65);
        drawPiece(baseDefX + shake, baseDefY, b.defender, modelScale * (1 - dp * 0.12), fadeAlpha, 0, false, 1.0);

      } else if (b.deathStyle === 'ROYAL_BLAST') {
        // 【大元帥氣功】：全身籠罩刺眼金光膨脹，化作漫天金粉消散
        const fadeAlpha = Math.max(0, 1 - dp * 1.15);
        drawPiece(baseDefX + dp * 24, baseDefY - dp * 28, b.defender, modelScale * (1 + dp * 0.45), fadeAlpha, dp * 0.2, false, 0);
        ctx.save();
        ctx.globalAlpha = Math.max(0, (1 - dp) * 0.85);
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.arc(baseDefX + dp * 24, baseDefY - dp * 28, 45 + dp * 55, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

      } else if (b.deathStyle === 'SLASH_SPLIT') {
        // 【仕/士雙刀】：一刀兩斷！上下半身沿斜線錯位滑開！
        const fadeAlpha = Math.max(0, 1 - Math.max(0, dp - 0.25) / 0.75);
        const slide = dp * 52;
        // 上半部
        ctx.save();
        ctx.beginPath();
        ctx.rect(baseDefX - 110, baseDefY - 110, 220, 102);
        ctx.clip();
        drawPiece(baseDefX - slide, baseDefY - slide * 0.4, b.defender, modelScale, fadeAlpha, -dp * 0.28, false, 0);
        ctx.restore();
        // 下半部
        ctx.save();
        ctx.beginPath();
        ctx.rect(baseDefX - 110, baseDefY - 8, 220, 110);
        ctx.clip();
        drawPiece(baseDefX + slide, baseDefY + slide * 0.4, b.defender, modelScale, fadeAlpha, dp * 0.32, false, 0);
        ctx.restore();

      } else if (b.deathStyle === 'FLATTEN') {
        // 【相/象洪水沖走】：被象鼻噴出的洶湧洪水浪濤沖得失去平衡，在浪花中翻滾沖出舞台右側！
        const washX = baseDefX + dp * 165;
        const washY = baseDefY - Math.sin(dp * Math.PI * 2) * 18 + dp * 10;
        const fadeAlpha = Math.max(0, 1 - Math.max(0, dp - 0.35) / 0.65);
        drawPiece(washX, washY, b.defender, modelScale * (1 - dp * 0.25), fadeAlpha, dp * 12, false, 0);

      } else if (b.deathStyle === 'SKY_LAUNCH') {
        // 【馬腿一腳踹飛】：被伸出的強健馬腿狠狠踹飛，斜向高速旋轉飛上天際化作星光！
        if (dp < 0.78) {
          const sc = Math.max(0.15, modelScale * (1 - dp * 1.05));
          const skyX = baseDefX + dp * 95;
          const skyY = baseDefY - dp * 245;
          drawPiece(skyX, skyY, b.defender, sc, 1.0, dp * 20, false, 0);
        } else {
          const starP = (dp - 0.78) / 0.22;
          const starSize = Math.sin(starP * Math.PI) * 42;
          const sx = baseDefX + 28, sy = stageY + 95;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.fillStyle = '#fff9c4';
          ctx.beginPath();
          ctx.moveTo(0, -starSize);
          ctx.lineTo(starSize * 0.22, -starSize * 0.22);
          ctx.lineTo(starSize, 0);
          ctx.lineTo(starSize * 0.22, starSize * 0.22);
          ctx.lineTo(0, starSize);
          ctx.lineTo(-starSize * 0.22, starSize * 0.22);
          ctx.lineTo(-starSize, 0);
          ctx.lineTo(-starSize * 0.22, -starSize * 0.22);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

      } else if (b.deathStyle === 'SKEWER_FLY') {
        // 【兵/卒長矛挑飛】：被長矛挑上半空，高速陀螺旋轉飛出舞台右上方！
        const flyX = baseDefX + dp * 140;
        const flyY = baseDefY - Math.sin(dp * Math.PI * 0.85) * 160 - dp * 40;
        const fadeAlpha = Math.max(0, 1 - dp * 1.1);
        drawPiece(flyX, flyY, b.defender, modelScale * (1 - dp * 0.3), fadeAlpha, dp * 18, false, 0);
      }
    }

    // 5. 繪製攻擊方特寫模型 + 「馬伸出馬腿踢飛」與「象伸出象鼻噴洪水」專屬肢體動畫！
    drawPiece(atkX, atkY, b.attacker, atkScale, 1.0, atkRot, false, 0);

    // 【馬 (H) 專屬肢體動畫】：伸出強健馬腿 + 閃亮馬蹄鐵狠踹敵人！
    if (type === 'H' && t >= 0.30 && t <= 0.68) {
      const kickP = t < 0.44 ? (t - 0.30) / 0.14 : Math.max(0, 1 - (t - 0.44) / 0.24);
      const legLen = 28 + kickP * 78; // 馬腿猛然伸長踢出！
      const hipX = atkX + 18;
      const hipY = atkY + 12;
      const hoofX = hipX + legLen;
      const hoofY = hipY - kickP * 26;

      ctx.save();
      // 1. 粗壯立體棕色馬腿 (帶肌肉漸層)
      const legGrad = ctx.createLinearGradient(hipX, hipY, hoofX, hoofY);
      legGrad.addColorStop(0, '#a86832');
      legGrad.addColorStop(0.7, '#d49b6a');
      legGrad.addColorStop(1, '#5c3314');
      ctx.strokeStyle = legGrad;
      ctx.lineWidth = 22;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(hoofX, hoofY);
      ctx.stroke();

      // 2. 馬蹄與 U 型金屬馬蹄鐵特寫
      ctx.translate(hoofX, hoofY);
      ctx.rotate(-0.25);
      ctx.fillStyle = '#2b1d14';
      roundRect(ctx, -10, -14, 22, 28, 8);
      ctx.fill();
      ctx.strokeStyle = '#ffd43b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(2, 0, 11, -Math.PI * 0.65, Math.PI * 0.65);
      ctx.stroke();
      ctx.restore();
    }

    // 【象 (E) 專屬肢體動畫】：高高伸出長長的立體象鼻，從鼻口噴出排山倒海的洶湧洪水！
    if (type === 'E' && t >= 0.22 && t <= 0.86) {
      const trunkExt = t < 0.36 ? (t - 0.22) / 0.14 : (t > 0.74 ? Math.max(0, 1 - (t - 0.74) / 0.12) : 1.0);
      const baseX = atkX + 24;
      const baseY = atkY + 6;
      const tipX = baseX + 22 + trunkExt * 56;
      const tipY = baseY - 8 - trunkExt * 16 + Math.sin(t * 25) * 4;

      ctx.save();
      // 1. 伸長的立體象鼻 (圓潤灰藍象鼻 + 橫向皮膚褶皺紋理)
      ctx.strokeStyle = '#7c8f99';
      ctx.lineWidth = 20;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.quadraticCurveTo(baseX + 32, baseY + 18, tipX, tipY);
      ctx.stroke();

      // 象鼻受光高光線
      ctx.strokeStyle = '#b4c6cf';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(baseX + 2, baseY - 3);
      ctx.quadraticCurveTo(baseX + 32, baseY + 13, tipX - 2, tipY - 3);
      ctx.stroke();

      // 象鼻尖端粉嫩鼻孔圈
      ctx.fillStyle = '#53646e';
      ctx.beginPath();
      ctx.ellipse(tipX + 2, tipY, 6, 9, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // 2. 從象鼻口噴出排山倒海的「洶湧洪水浪濤」沖向敵人！
      if (t >= 0.30) {
        const floodP = Math.min(1, (t - 0.30) / 0.16);
        const floodFade = t > 0.74 ? Math.max(0, 1 - (t - 0.74) / 0.12) : 1.0;
        const reachX = tipX + (stageX + stageW - tipX + 30) * floodP;

        ctx.save();
        ctx.globalAlpha = floodFade;

        // 外層深海藍洪水巨浪柱
        const waterGrad = ctx.createLinearGradient(tipX, tipY, reachX, baseDefY);
        waterGrad.addColorStop(0, '#38bdf8');
        waterGrad.addColorStop(0.5, '#0284c7');
        waterGrad.addColorStop(1, '#0369a1');
        ctx.fillStyle = waterGrad;
        ctx.beginPath();
        ctx.moveTo(tipX, tipY - 8);
        ctx.quadraticCurveTo((tipX + reachX) * 0.5, tipY - 48, reachX, baseDefY - 68);
        ctx.lineTo(reachX, baseDefY + 46);
        ctx.quadraticCurveTo((tipX + reachX) * 0.5, baseDefY + 42, tipX, tipY + 8);
        ctx.closePath();
        ctx.fill();

        // 中層亮青色激流波紋
        ctx.strokeStyle = 'rgba(186, 230, 253, 0.85)';
        ctx.lineWidth = 6;
        for (let w = 0; w < 4; w++) {
          const wyOff = (w - 1.5) * 18;
          const waveShift = Math.sin(t * 28 + w * 1.5) * 8;
          ctx.beginPath();
          ctx.moveTo(tipX + 10, tipY + wyOff * 0.25);
          ctx.quadraticCurveTo((tipX + reachX) * 0.5, tipY - 12 + wyOff + waveShift, reachX - 10, baseDefY - 10 + wyOff * 1.4);
          ctx.stroke();
        }

        // 前端翻滾的白色浪花泡沫團！
        ctx.fillStyle = '#ffffff';
        for (let f = 0; f < 9; f++) {
          const fx = reachX - 18 + Math.sin(t * 35 + f) * 14;
          const fy = baseDefY - 58 + f * 12;
          const fr = 10 + Math.cos(t * 30 + f * 2) * 4;
          ctx.beginPath();
          ctx.arc(fx, fy, Math.max(4, fr), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.restore();
    }

    // 6. 繪製舞台內的招式武器光效 (砲彈、氣功波、十字劍氣、象鼻水柱+天降巨石、馬蹄彎月波、長矛寒光)
    if (type === 'C') {
      if (t >= 0.24 && t < 0.44) {
        const p = (t - 0.24) / 0.20;
        const bx = (atkX + 25) + (baseDefX - atkX - 25) * p;
        const by = (atkY - 25) + (baseDefY - atkY + 15) * p - Math.sin(p * Math.PI) * 95;
        // 砲口火光
        if (p < 0.35) {
          ctx.fillStyle = 'rgba(255, 180, 40, 0.85)';
          ctx.beginPath();
          ctx.arc(atkX + 20, atkY - 28, 28 * (1 - p), 0, Math.PI * 2);
          ctx.fill();
        }
        // 飛行高爆砲彈
        ctx.fillStyle = '#ff5500';
        ctx.beginPath();
        ctx.arc(bx, by, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff7c2';
        ctx.beginPath();
        ctx.arc(bx, by, 8, 0, Math.PI * 2);
        ctx.fill();
      } else if (t >= 0.44) {
        const ep = Math.min(1, (t - 0.44) / 0.45);
        ctx.strokeStyle = `rgba(255, 90, 20, ${1 - ep})`;
        ctx.lineWidth = 14 * (1 - ep);
        ctx.beginPath();
        ctx.arc(baseDefX, baseDefY, 30 + ep * 110, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (type === 'K') {
      if (t >= 0.24 && t < 0.44) {
        const p = (t - 0.24) / 0.20;
        const bx = (atkX + 35) + (baseDefX - atkX - 35) * p;
        const by = atkY - 10;
        const grad = ctx.createRadialGradient(bx, by, 5, bx, by, 42);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.45, '#ffd43b');
        grad.addColorStop(1, 'rgba(255, 120, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, 42, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (type === 'A' && t >= 0.42 && t < 0.78) {
      const ep = (t - 0.42) / 0.36;
      ctx.save();
      ctx.translate(baseDefX, baseDefY);
      ctx.globalAlpha = 1 - ep;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 12 * (1 - ep * 0.5);
      ctx.beginPath();
      ctx.moveTo(-95, -85); ctx.lineTo(95, 85);
      ctx.moveTo(95, -85); ctx.lineTo(-95, 85);
      ctx.stroke();
      ctx.restore();
    } else if (type === 'H' && t >= 0.42 && t <= 0.72) {
      // 【馬腿踢中衝擊波】：在馬蹄踢中敵人處爆發金色衝擊氣環
      const ep = (t - 0.42) / 0.30;
      ctx.save();
      ctx.translate(baseDefX - 18, baseDefY - 8);
      ctx.strokeStyle = `rgba(255, 230, 102, ${1 - ep})`;
      ctx.lineWidth = 10 * (1 - ep);
      ctx.beginPath();
      ctx.arc(0, 0, 22 + ep * 65, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (type === 'P' && t >= 0.38 && t < 0.72) {
      const ep = (t - 0.38) / 0.34;
      ctx.save();
      ctx.translate(baseDefX, baseDefY);
      ctx.globalAlpha = 1 - ep;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.moveTo(-80, -14);
      ctx.lineTo(95 + ep * 40, -25);
      ctx.lineTo(-80, 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 命中瞬間衝擊閃光 (Impact Flash)
    if (t >= 0.43 && t <= 0.50) {
      const flashAlpha = Math.sin(((t - 0.43) / 0.07) * Math.PI) * 0.55;
      ctx.fillStyle = `rgba(255, 245, 200, ${flashAlpha})`;
      ctx.fillRect(stageX, stageY, stageW, stageH);
    }

    ctx.restore(); // 結束舞台內部 clip

    // 舞台外框雙層金邊
    roundRect(ctx, stageX, stageY, stageW, stageH, 20);
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = '#e8b960';
    ctx.stroke();

    // 底部霸氣招式名稱書法橫幅
    const bannerW = 320, bannerH = 46;
    const bannerX = (LOGICAL_W - bannerW) / 2;
    const bannerY = stageY + stageH - 28;
    roundRect(ctx, bannerX, bannerY, bannerW, bannerH, 23);
    ctx.fillStyle = '#1a0c05';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffd866';
    ctx.stroke();

    ctx.fillStyle = '#ffd866';
    ctx.font = 'bold 24px "KaiTi", "DFKai-SB", "PingFang TC", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.title, LOGICAL_W / 2, bannerY + bannerH / 2 + 1);

    ctx.restore();

    // 7. 若是「車撞飛向螢幕 (SCREEN_FLY)」，突破劇場邊框直接朝玩家螢幕正面撲過來！
    if (b.deathStyle === 'SCREEN_FLY' && t >= 0.44) {
      const flyP = (t - 0.44) / 0.56;
      const flyAlpha = flyP > 0.76 ? Math.max(0, 1 - (flyP - 0.76) / 0.24) : 1.0;
      drawPiece(b.defFlyX, b.defFlyY, b.defender, b.defScale, flyAlpha, b.defRot, false, 0);
    }

    ctx.restore();
  }

  // 繪製七大兵種吃子時的專屬攻擊特效
  function drawBattleEffect(b) {
    const t = b.progress;
    const type = b.attacker.type;
    const isRed = b.attacker.side === SIDE_RED;
    const mainColor = isRed ? '#ff4d36' : '#38b6ff';
    const subColor = '#ffe066';

    ctx.save();
    if (type === 'C') {
      // 【炮】：防空砲砲彈高爆命中 + 焦黑煙霧
      if (t < 0.38) {
        const p = t / 0.38;
        const bx = b.startX + (b.targetX - b.startX) * p;
        const by = b.startY + (b.targetY - b.startY) * p - Math.sin(p * Math.PI) * 85;
        ctx.beginPath();
        ctx.arc(bx, by, 13, 0, Math.PI * 2);
        ctx.fillStyle = '#ff5500';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx, by, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#fff7c2';
        ctx.fill();
      } else {
        const ep = Math.min(1, (t - 0.38) / 0.45);
        const radius = 22 + ep * 85;
        ctx.beginPath();
        ctx.arc(b.targetX, b.targetY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 95, 20, ${1 - ep})`;
        ctx.lineWidth = 11 * (1 - ep);
        ctx.stroke();
      }
    } else if (type === 'R') {
      // 【車】：裝甲戰車高速衝撞氣流與地面擦痕
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 11;
      ctx.globalAlpha = Math.max(0, 1 - t);
      ctx.beginPath();
      ctx.moveTo(b.startX, b.startY);
      ctx.lineTo(b.targetX, b.targetY);
      ctx.stroke();

      if (t >= 0.38) {
        const ep = (t - 0.38) / 0.62;
        ctx.beginPath();
        ctx.arc(b.targetX, b.targetY, 24 + ep * 75, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 224, 102, ${1 - ep})`;
        ctx.lineWidth = 7 * (1 - ep);
        ctx.stroke();
      }
    } else if (type === 'K') {
      // 【帥/將】：皇極金龍霸王氣功波！
      if (t < 0.38) {
        const p = t / 0.38;
        const bx = b.startX + (b.targetX - b.startX) * p;
        const by = b.startY + (b.targetY - b.startY) * p;
        const grad = ctx.createRadialGradient(bx, by, 4, bx, by, 30);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, '#ffd43b');
        grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, 30, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const ep = (t - 0.38) / 0.62;
        ctx.translate(b.targetX, b.targetY);
        ctx.strokeStyle = `rgba(255, 215, 59, ${1 - ep})`;
        ctx.lineWidth = 8 * (1 - ep);
        ctx.beginPath();
        ctx.arc(0, 0, 18 + ep * 95, 0, Math.PI * 2);
        ctx.stroke();
        for (let i = 0; i < 8; i++) {
          const ang = (Math.PI * 2 * i) / 8 + ep * 1.5;
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * 15, Math.sin(ang) * 15);
          ctx.lineTo(Math.cos(ang) * (35 + ep * 85), Math.sin(ang) * (35 + ep * 85));
          ctx.stroke();
        }
      }
    } else if (type === 'A') {
      // 【仕/士】：雙刃寒光十字裂空斬！
      if (t >= 0.34) {
        const ep = (t - 0.34) / 0.66;
        ctx.translate(b.targetX, b.targetY);
        ctx.globalAlpha = Math.max(0, 1 - ep * 1.1);
        ctx.strokeStyle = '#e0f2fe';
        ctx.lineWidth = 9 * (1 - ep * 0.6);
        ctx.beginPath();
        ctx.moveTo(-62, -62);
        ctx.lineTo(62, 62);
        ctx.moveTo(62, -62);
        ctx.lineTo(-62, 62);
        ctx.stroke();

        ctx.strokeStyle = subColor;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-55, -55);
        ctx.lineTo(55, 55);
        ctx.moveTo(55, -55);
        ctx.lineTo(-55, 55);
        ctx.stroke();
      }
    } else if (type === 'E') {
      // 【相/象】：泰山壓頂裂地衝擊波 + 碎石裂紋！
      if (t >= 0.38) {
        const ep = (t - 0.38) / 0.62;
        ctx.translate(b.targetX, b.targetY + 12);
        for (let k = 0; k < 3; k++) {
          const rx = Math.max(2, (24 + ep * 85) - k * 15);
          const ry = Math.max(2, (11 + ep * 38) - k * 7);
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255, 200, 90, ${Math.max(0, 1 - ep)})`;
          ctx.lineWidth = Math.max(1, 5 - k);
          ctx.stroke();
        }
        ctx.strokeStyle = `rgba(60, 30, 10, ${1 - ep})`;
        ctx.lineWidth = 3;
        for (let i = 0; i < 6; i++) {
          const ang = (Math.PI * 2 * i) / 6 + 0.3;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ang) * (25 + ep * 45), Math.sin(ang) * (12 + ep * 22));
          ctx.stroke();
        }
      }
    } else if (type === 'H') {
      // 【馬/傌】：連環鐵蹄旋風氣環 + 升龍衝擊柱！
      if (t >= 0.35) {
        const ep = (t - 0.35) / 0.65;
        ctx.translate(b.targetX, b.targetY);
        ctx.strokeStyle = `rgba(255, 224, 102, ${1 - ep})`;
        ctx.lineWidth = 6;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.ellipse(0, -ep * (40 + i * 35), 28 - i * 4, 9, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    } else {
      // 【兵/卒】：精鋼長矛穿雲突刺閃光！
      if (t >= 0.34) {
        const ep = (t - 0.34) / 0.66;
        const dx = b.targetX - b.startX;
        const dy = b.targetY - b.startY;
        const angle = Math.atan2(dy, dx);
        ctx.translate(b.targetX, b.targetY);
        ctx.rotate(angle);
        ctx.globalAlpha = 1 - ep;
        ctx.fillStyle = subColor;
        ctx.beginPath();
        ctx.moveTo(-45, -8);
        ctx.lineTo(65 + ep * 40, 0);
        ctx.lineTo(-45, 8);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();

    // 招式橫幅提示
    if (t > 0.2 && t < 0.92) {
      ctx.save();
      const bannerY = Math.max(150, b.targetY - 72);
      ctx.font = 'bold 24px "PingFang TC", "Microsoft JhengHei", sans-serif';
      const tw = ctx.measureText(b.title).width + 36;
      roundRect(ctx, b.targetX - tw / 2, bannerY - 20, tw, 38, 19);
      ctx.fillStyle = 'rgba(25, 12, 6, 0.88)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffd866';
      ctx.stroke();

      ctx.fillStyle = '#ffd866';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.title, b.targetX, bannerY);
      ctx.restore();
    }
  }

  function drawBoard() {
    const pad = 24;
    roundRect(ctx, BOARD_LEFT - pad, BOARD_TOP - pad, BOARD_W + pad * 2, BOARD_H + pad * 2, 14);
    // 玩具屋厚實木地板底座陰影
    roundRect(ctx, BOARD_LEFT - pad, BOARD_TOP - pad + 7, BOARD_W + pad * 2, BOARD_H + pad * 2, 18);
    ctx.fillStyle = '#9c7147';
    ctx.fill();

    roundRect(ctx, BOARD_LEFT - pad, BOARD_TOP - pad, BOARD_W + pad * 2, BOARD_H + pad * 2, 18);
    const boardGrad = ctx.createLinearGradient(0, BOARD_TOP - pad, 0, BOARD_TOP + BOARD_H + pad);
    boardGrad.addColorStop(0, '#edd1a7');
    boardGrad.addColorStop(0.5, '#e2be8d');
    boardGrad.addColorStop(1, '#d4ad79');
    ctx.fillStyle = boardGrad;
    ctx.fill();

    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#b58858';
    ctx.stroke();

    ctx.strokeStyle = '#8c6239';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(BOARD_LEFT - 5, BOARD_TOP - 5, BOARD_W + 10, BOARD_H + 10);

    ctx.lineWidth = 1.5;
    for (let r = 0; r < 10; r++) {
      const y = BOARD_TOP + r * CELL_SIZE;
      ctx.beginPath();
      ctx.moveTo(BOARD_LEFT, y);
      ctx.lineTo(BOARD_LEFT + BOARD_W, y);
      ctx.stroke();
    }

    for (let c = 0; c < 9; c++) {
      const x = BOARD_LEFT + c * CELL_SIZE;
      if (c === 0 || c === 8) {
        ctx.beginPath();
        ctx.moveTo(x, BOARD_TOP);
        ctx.lineTo(x, BOARD_TOP + BOARD_H);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(x, BOARD_TOP);
        ctx.lineTo(x, BOARD_TOP + 4 * CELL_SIZE);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, BOARD_TOP + 5 * CELL_SIZE);
        ctx.lineTo(x, BOARD_TOP + BOARD_H);
        ctx.stroke();
      }
    }

    const drawPalace = (topRow) => {
      const p1 = gridToPixel(topRow, 3);
      const p2 = gridToPixel(topRow + 2, 5);
      const p3 = gridToPixel(topRow, 5);
      const p4 = gridToPixel(topRow + 2, 3);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.moveTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.stroke();
    };
    drawPalace(0);
    drawPalace(7);

    const starCoords = [
      [2, 1], [2, 7], [7, 1], [7, 7],
      [3, 0], [3, 2], [3, 4], [3, 6], [3, 8],
      [6, 0], [6, 2], [6, 4], [6, 6], [6, 8]
    ];
    for (const [sr, sc] of starCoords) {
      const pt = gridToPixel(sr, sc);
      const d = 4, l = 9;
      ctx.lineWidth = 1.4;
      if (sc > 0) {
        ctx.beginPath();
        ctx.moveTo(pt.x - d - l, pt.y - d); ctx.lineTo(pt.x - d, pt.y - d); ctx.lineTo(pt.x - d, pt.y - d - l);
        ctx.moveTo(pt.x - d - l, pt.y + d); ctx.lineTo(pt.x - d, pt.y + d); ctx.lineTo(pt.x - d, pt.y + d + l);
        ctx.stroke();
      }
      if (sc < 8) {
        ctx.beginPath();
        ctx.moveTo(pt.x + d + l, pt.y - d); ctx.lineTo(pt.x + d, pt.y - d); ctx.lineTo(pt.x + d, pt.y - d - l);
        ctx.moveTo(pt.x + d + l, pt.y + d); ctx.lineTo(pt.x + d, pt.y + d); ctx.lineTo(pt.x + d, pt.y + d + l);
        ctx.stroke();
      }
    }

    ctx.fillStyle = '#8c6239';
    ctx.font = 'bold 26px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const riverY = BOARD_TOP + 4.5 * CELL_SIZE;
    ctx.fillText('楚 河', BOARD_LEFT + 2 * CELL_SIZE, riverY);
    ctx.fillText('漢 界', BOARD_LEFT + 6 * CELL_SIZE, riverY);

    if (state.lastMove) {
      const fPos = gridToPixel(state.lastMove.fr, state.lastMove.fc);
      const tPos = gridToPixel(state.lastMove.tr, state.lastMove.tc);
      ctx.strokeStyle = 'rgba(42, 130, 50, 0.85)';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(fPos.x - 14, fPos.y - 14, 28, 28);
      ctx.strokeRect(tPos.x - 25, tPos.y - 25, 50, 50);
    }

    // 合法落點與護帥提示移至所有 3D 貓咪公仔上層繪製 (drawMoveIndicators)，確保絕不被立體貓耳遮擋！
  }

    drawButton({

      bg1: '#4a2d1b',
      bg2: '#2e1a0e'
    });

    // 第二列：回合、戰功與 60 回合自然限著計步
    ctx.fillStyle = '#f5e6c8';
    ctx.font = 'bold 16px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'left';
    const noCapRounds = Math.floor(state.noCaptureHalfMoves / 2);
    ctx.fillText(`第 ${state.turnCount} 回合  |  戰功：${state.score}  |  限著：${noCapRounds}/60`, 32, 80, LOGICAL_W - 64);

    // 第三列：左側出招方提示 + 右側選中棋子稱號（設定 maxWidth 確保在 iPhone 13 / 17 Pro Max 絕不互撞跑版！）
    const turnText = state.aiThinking
      ? '玄豹貓（電腦）思索中...'
      : (state.turn === SIDE_RED ? '輪到：赤虎貓（紅方）' : '輪到：玄豹貓（黑方）');
    ctx.fillStyle = state.turn === SIDE_RED ? '#ff8b66' : '#7ac8ff';
    ctx.font = 'bold 16px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(turnText, 32, 116, 225);

    if (state.selected) {
      const sp = state.board[state.selected.r][state.selected.c];
      if (sp) {
        ctx.fillStyle = '#ffd866';
        ctx.font = 'bold 14.5px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`【${PIECE_LABELS[sp.side][sp.type]}】${PIECE_TITLES[sp.type]}`, LOGICAL_W - 32, 116, 235);
      }
    }

    drawBoard();

    // 由上至下繪製靜止的 3D 貓咪公仔
    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 9; c++) {
        const p = state.board[r][c];
        if (!p) continue;
        const pos = gridToPixel(r, c);
        const isSel = state.selected && state.selected.r === r && state.selected.c === c;
        drawPiece(pos.x, pos.y, p, 1, 1, 0, isSel, 0);
      }
    }

    // 在所有 3D 貓咪公仔的「最上層」繪製合法落點綠點與可吃子紅準星，保證絕不被前後排貓頭遮擋！
    for (const m of state.legalMoves) {
      const pos = gridToPixel(m.tr, m.tc);
      const target = state.board[m.tr][m.tc];
      if (target) {
        // 可吃子目標：醒目雙環紅準星 + 「可吃」角標
        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff2a1a';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        ctx.fillStyle = '#d91e18';
        roundRect(ctx, -16, -31, 32, 16, 8);
        ctx.fill();
        ctx.strokeStyle = '#fff8eb';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10.5px "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚔️吃', 0, -23);
        ctx.restore();
      } else {
        // 可移動空地：立體白邊翠綠圓點 (浮在公仔圖層上方，任何角度都清晰可見)
        ctx.save();
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#22b549';
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#fffdf7';
        ctx.stroke();
        ctx.restore();
      }
    }

    // 若選中棋子正保護主帥（移開會導致將帥照面或敵方吃帥），在禁著格繪製小鎖頭/禁著標記
    if (state.blockedMoves && state.blockedMoves.length > 0) {
      for (const bm of state.blockedMoves) {
        const bpos = gridToPixel(bm.tr, bm.tc);
        ctx.save();
        ctx.beginPath();
        ctx.arc(bpos.x, bpos.y, 7.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180, 45, 35, 0.72)';
        ctx.fill();
        ctx.strokeStyle = '#fff5eb';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(bpos.x - 3.8, bpos.y - 3.8); ctx.lineTo(bpos.x + 3.8, bpos.y + 3.8);
        ctx.moveTo(bpos.x + 3.8, bpos.y - 3.8); ctx.lineTo(bpos.x - 3.8, bpos.y + 3.8);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 若點擊了受牽制的禁著格，畫出敵方將軍威脅閃電紅虛線
    if (state.warningLine && state.warningLine.timer > 0) {
      const wl = state.warningLine;
      const p1 = gridToPixel(wl.from.r, wl.from.c);
      const p2 = gridToPixel(wl.to.r, wl.to.c);
      ctx.save();
      ctx.strokeStyle = `rgba(235, 30, 30, ${Math.min(1, wl.timer)})`;
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.restore();
    }

    if (state.moveAnim) {
      const m = state.moveAnim;
      const ease = 1 - Math.pow(1 - m.progress, 3);
      const curX = m.startX + (m.targetX - m.startX) * ease;
      const curY = m.startY + (m.targetY - m.startY) * ease - Math.sin(m.progress * Math.PI) * 14;
      drawPiece(curX, curY, m.piece, 1.12, 1, 0, false, 0);
    }

    // 底部戰俘與功能面板先繪製，讓吃子演武小劇場可以霸氣覆蓋於畫面上方！
    roundRect(ctx, 18, 742, LOGICAL_W - 36, 198, 14);
    ctx.fillStyle = '#233d3b';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#82a39e';
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.font = 'bold 15px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillStyle = '#ff9988';
    const redCaps = state.capturedByRed.map(p => PIECE_LABELS[p.side][p.type]).join(' ') || '尚無';
    ctx.fillText(`赤虎貓擊敗：${redCaps}`, 34, 772, LOGICAL_W - 68);

    ctx.fillStyle = '#88c9ff';
    const blkCaps = state.capturedByBlack.map(p => PIECE_LABELS[p.side][p.type]).join(' ') || '尚無';
    ctx.fillText(`玄豹貓擊敗：${blkCaps}`, 34, 802, LOGICAL_W - 68);

    const btnY = 836;
    const btnW = 148;
    const btnH = 48;
    drawButton({
      x: 34, y: btnY, w: btnW, h: btnH, r: 10,
      label: '↩ 悔棋一招',
      fontSize: 17,
      bg1: state.history.length > 0 ? '#3a5a40' : '#3a3532',
      bg2: state.history.length > 0 ? '#233827' : '#24201e',
      action: 'UNDO'
    });
    drawButton({
      x: 196, y: btnY, w: btnW, h: btnH, r: 10,
      label: '🔄 重新開局',
      fontSize: 17,
      bg1: '#7a4b1e',
      bg2: '#4d2d10',
      action: 'RESTART'
    });
    drawButton({
      x: 358, y: btnY, w: btnW, h: btnH, r: 10,
      label: '🏠 主選單',
      fontSize: 17,
      bg1: '#6e231c',
      bg2: '#45130e',
      action: 'MENU'
    });

    ctx.fillStyle = '#bfa682';
    ctx.font = '14px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('點錯棋子？再點一次原棋子或棋盤空白處即可取消選取', LOGICAL_W / 2, 914);

    // 當發生吃子時，彈出《決戰中國象棋》風格的專屬演武小劇場動畫！
    if (state.battleAnim) {
      renderBattleCutscene(state.battleAnim);
    }
  }

      { type: 'C', side: SIDE_BLACK, desc: '炮/包【防空砲】：砲彈轟中敵棋變焦黑化灰消失！' },
      { type: 'H', side: SIDE_RED, desc: '傌/馬【騎兵貓】：伸出強健馬腿一腳把敵棋踹飛上天！' },
      { type: 'E', side: SIDE_BLACK, desc: '相/象【戰象貓】：伸長象鼻噴出洶湧洪水把敵棋沖走！' },
      { type: 'A', side: SIDE_RED, desc: '仕/士【護衛貓】：雙刃十字斬將敵棋劈成兩半！' },
      { type: 'P', side: SIDE_BLACK, desc: '兵/卒【先鋒貓】：精鋼長矛把敵棋挑飛高速旋轉！' }
    ];

    let y = 148;
    for (const item of roster) {
      drawPiece(76, y, { side: item.side, type: item.type }, 0.95);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#f5e6c8';
      ctx.font = 'bold 15.5px "PingFang TC", "Microsoft JhengHei", sans-serif';
      ctx.fillText(item.desc, 116, y + 4);
      y += 58;
    }

    ctx.fillStyle = '#ffd866';
    ctx.font = 'bold 18px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText('【中國象棋官方競賽規則】', 52, y + 12);

    ctx.fillStyle = '#e8d5b7';
    ctx.font = '15px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText('• 禁止長將與長捉：連續追將或重複追捉同一顆無根', 52, y + 40);
    ctx.fillText('  ／高價值敵子達3次時，系統自動攔截並要求變著。', 52, y + 65);
    ctx.fillText('• 競賽和棋判定：支援三次重複局面（雙方不變作和）', 52, y + 90);
    ctx.fillText('  、60回合無吃子自然限著，以及無進攻子力例和。', 52, y + 115);

    drawButton({
      x: 110, y: 816, w: LOGICAL_W - 220, h: 58, r: 15,
      label: '返回主選單',
      fontSize: 22,
      action: 'MENU'
    });
  }

  function renderGameOverOverlay() {
    ctx.fillStyle = 'rgba(12, 6, 3, 0.78)';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    roundRect(ctx, 44, 230, LOGICAL_W - 88, 470, 22);
    const grad = ctx.createLinearGradient(0, 230, 0, 700);
    grad.addColorStop(0, '#3b2113');
    grad.addColorStop(1, '#211109');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffd866';
    ctx.stroke();

    const isDraw = state.winner === 'DRAW';
    const isRedWin = state.winner === SIDE_RED;
    ctx.fillStyle = isDraw ? '#a8e6cf' : (isRedWin ? '#ffd866' : '#80caff');
    ctx.font = 'bold 42px "KaiTi", "DFKai-SB", "Microsoft JhengHei", serif';
    ctx.textAlign = 'center';
    ctx.fillText(isDraw ? '雙方握手言和！' : (isRedWin ? '赤虎貓軍凱旋！' : '玄豹貓軍制勝！'), LOGICAL_W / 2, 305);

    ctx.fillStyle = '#f5e6c8';
    ctx.font = 'bold 20px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText(state.winReason, LOGICAL_W / 2, 365);

    ctx.fillStyle = '#ffd866';
    ctx.font = 'bold 26px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText(`本局戰功：${state.score}`, LOGICAL_W / 2, 430);

    ctx.fillStyle = '#d4b483';
    ctx.font = '19px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText(`總回合數：${state.turnCount}  |  最高紀錄：${state.bestScore}`, LOGICAL_W / 2, 475);

    drawButton({
      x: 95, y: 530, w: LOGICAL_W - 190, h: 62, r: 16,
      label: '⚔️ 再玩一次',
      fontSize: 23,
      bg1: '#a3281d',
      bg2: '#69150e',
      action: 'RESTART'
    });

    drawButton({
      x: 95, y: 610, w: LOGICAL_W - 190, h: 54, r: 14,
      label: '返回主選單',
      fontSize: 20,
      bg1: '#4d3624',
      bg2: '#302014',
      action: 'MENU'
    });
  }

  // =========================================================================
  // 6. 遊戲主迴圈與動畫更新
  // =========================================================================
  let lastTime = performance.now();

  function update(dt) {
    state.animClock += dt;
    if (state.warningLine && state.warningLine.timer > 0) {
      state.warningLine.timer = Math.max(0, state.warningLine.timer - dt);
    }

    if (state.screenShake > 0) {
      state.screenShake = Math.max(0, state.screenShake - dt * 35);
    }

    if (state.moveAnim) {
      state.moveAnim.progress += dt / state.moveAnim.duration;
      if (state.moveAnim.progress >= 1) {
        const { move, piece } = state.moveAnim;
        state.moveAnim = null;
        finalizeMove(move, piece, null);
      }
    }

    if (state.battleAnim) {
      const b = state.battleAnim;
      b.progress += dt / b.duration;

      // 在進度 0.44 瞬間觸發演武舞台中央的七大兵種專屬命中特效！
      if (b.progress >= 0.44 && !b.hitTriggered) {
        b.hitTriggered = true;
        state.screenShake = (b.deathStyle === 'SCREEN_FLY' || b.deathStyle === 'FLATTEN') ? 18 : 13;
        const hitX = 392, hitY = 472;

        if (b.deathStyle === 'ASH') {
          spawnParticles(hitX, hitY, '#ff6b1a', 34, 7.5);
          spawnAshParticles(hitX, hitY, 85);
        } else if (b.deathStyle === 'SCREEN_FLY') {
          spawnParticles(hitX, hitY, '#ffbe3b', 36, 8.5);
          spawnParticles(hitX, hitY, '#ff4d36', 24, 7.0);
        } else if (b.deathStyle === 'ROYAL_BLAST') {
          spawnParticles(hitX, hitY, '#ffd43b', 45, 8.0);
          spawnParticles(hitX, hitY, '#fff9c4', 28, 5.5);
        } else if (b.deathStyle === 'SLASH_SPLIT') {
          spawnParticles(hitX, hitY, '#e0f2fe', 34, 8.0);
          spawnParticles(hitX, hitY, '#ffd43b', 20, 5.5);
        } else if (b.deathStyle === 'FLATTEN') {
          spawnParticles(hitX, hitY, '#38bdf8', 38, 8.5);
          spawnParticles(hitX, hitY, '#ffffff', 26, 6.5);
        } else if (b.deathStyle === 'SKY_LAUNCH') {
          spawnParticles(hitX, hitY, '#ffe066', 32, 7.5);
        } else {
          const color = b.attacker.side === SIDE_RED ? '#ff6b35' : '#4cc9f0';
          spawnParticles(hitX, hitY, color, 32, 7.5);
        }
      }

      // 命中後的車撞飛出螢幕物理軌跡
      if (b.progress >= 0.44 && b.deathStyle === 'SCREEN_FLY') {
        const flyP = (b.progress - 0.44) / 0.56;
        b.defScale = 2.35 + Math.pow(flyP, 1.4) * 5.8;
        b.defFlyX = 392 - flyP * 110;
        b.defFlyY = 472 + flyP * 160;
        b.defRot += 0.22;
      }

      if (b.progress >= 1) {
        const { move, attacker, defender } = b;
        state.battleAnim = null;
        finalizeMove(move, attacker, defender);
      }
    }

    if (state.aiThinking && !state.moveAnim && !state.battleAnim && state.screen === 'PLAYING') {
      state.aiTimer -= dt;
      if (state.aiTimer <= 0) {
        state.aiThinking = false;
        const aiMove = getBestAIMove(state.board, state.difficulty);
        if (aiMove) {
          executeMove(aiMove);
        }
      }
    }

    // 一般火花粒子更新
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= p.decay;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    // 焦黑化灰粒子更新 (隨風飄散效果)
    for (let i = state.ashParticles.length - 1; i >= 0; i--) {
      const ap = state.ashParticles[i];
      ap.wobble += 0.14;
      ap.x += ap.vx + Math.sin(ap.wobble) * 0.85;
      ap.y += ap.vy;
      ap.life -= ap.decay;
      if (ap.life <= 0) state.ashParticles.splice(i, 1);
    }

    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
      const ft = state.floatingTexts[i];
      ft.y += ft.vy;
      ft.life -= ft.decay;
      if (ft.life <= 0) state.floatingTexts.splice(i, 1);
    }
  }

  function render() {
    state.uiButtons = [];
    ctx.save();
    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

    ctx.fillStyle = '#ebd9c5';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (state.screenShake > 0) {
      const sx = (Math.random() - 0.5) * state.screenShake;
      const sy = (Math.random() - 0.5) * state.screenShake;
      ctx.translate(sx, sy);
    }

    if (state.screen === 'MENU') {
      renderMenu();
    } else if (state.screen === 'HELP') {
      renderHelp();
    } else if (state.screen === 'PLAYING' || state.screen === 'GAMEOVER') {
      renderPlaying();
      if (state.screen === 'GAMEOVER') {
        renderGameOverOverlay();
      }
    }

    // 繪製焦黑灰燼粒子
    for (const ap of state.ashParticles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ap.life);
      ctx.fillStyle = `rgb(${ap.shade}, ${ap.shade}, ${ap.shade})`;
      ctx.beginPath();
      ctx.ellipse(ap.x, ap.y, ap.size, ap.size * 0.6, ap.wobble, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 繪製火花粒子
    for (const p of state.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const ft of state.floatingTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.font = `bold ${ft.size}px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif`;
      ctx.textAlign = 'center';
      const maxW = LOGICAL_W - 36;
      const measuredW = Math.min(maxW, ctx.measureText(ft.text).width);
      const clampedX = Math.max(18 + measuredW / 2, Math.min(LOGICAL_W - 18 - measuredW / 2, ft.x));
      ctx.strokeStyle = '#1a0a04';
      ctx.lineWidth = 4;
      ctx.strokeText(ft.text, clampedX, ft.y, maxW);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, clampedX, ft.y, maxW);
      ctx.restore();
    }

    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // =========================================================================
  // 7. Pointer 觸控與滑鼠點擊事件處理 (支援完整取消選取邏輯)
  // =========================================================================
  function getLogicalPoint(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = LOGICAL_W / rect.width;
    const scaleY = LOGICAL_H / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  // 防止 iOS Safari 雙指縮放與橡皮筋拖曳導致跑版
  document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.unlock();
    const pt = getLogicalPoint(e);

    // 1. 優先檢查 UI 按鈕點擊
    for (let i = state.uiButtons.length - 1; i >= 0; i--) {
      const btn = state.uiButtons[i];
      if (pt.x >= btn.x && pt.x <= btn.x + btn.w && pt.y >= btn.y && pt.y <= btn.y + btn.h) {
        if (btn.label.includes('音效') || btn.action === 'MUTE') {
          sfx.toggleMute();
          if (!sfx.muted) sfx.playSelect();
          return;
        }
        if (btn.action === 'DESELECT') {
          state.selected = null;
          state.legalMoves = [];
          state.blockedMoves = [];
          state.warningLine = null;
          sfx.playCancel();
          return;
        }
        sfx.playSelect();
        if (btn.action === 'START_NORMAL') resetGame('AI', 'normal');
        else if (btn.action === 'START_HARD') resetGame('AI', 'hard');
        else if (btn.action === 'START_PVP') resetGame('PVP', 'normal');
        else if (btn.action === 'HELP') state.screen = 'HELP';
        else if (btn.action === 'MENU') state.screen = 'MENU';
        else if (btn.action === 'RESTART') resetGame(state.mode, state.difficulty);
        else if (btn.action === 'UNDO') handleUndo();
        return;
      }
    }

    // 2. 棋盤對弈操作
    if (state.screen !== 'PLAYING') return;
    if (state.moveAnim || state.battleAnim || state.aiThinking) return;
    if (state.mode === 'AI' && state.turn !== SIDE_RED) return;

    const cell = pixelToGrid(pt.x, pt.y);

    // 若點擊在棋盤格線外，且目前有選中棋子 -> 直接取消選取！
    if (!cell) {
      if (state.selected) {
        state.selected = null;
        state.legalMoves = [];
        sfx.playCancel();
      }
      return;
    }

    // 若已選中棋子
    if (state.selected) {
      // (A) 再次點擊「同一顆已選中的棋子」 -> 取消選取！
      if (state.selected.r === cell.r && state.selected.c === cell.c) {
        state.selected = null;
        state.legalMoves = [];
        state.blockedMoves = [];
        state.warningLine = null;
        sfx.playCancel();
        return;
      }

      // (B) 點擊合法目標格 -> 執行行棋或吃子！
      const chosenMove = state.legalMoves.find(m => m.tr === cell.r && m.tc === cell.c);
      if (chosenMove) {
        executeMove(chosenMove);
        return;
      }

      // (B2) 若點擊的是「因保護主帥而被禁止移動」的格子（例如移開會導致敵方炮將軍或王見王），保留選取並顯示威脅連線說明！
      const pinnedMove = (state.blockedMoves || []).find(m => m.tr === cell.r && m.tc === cell.c);
      if (pinnedMove && pinnedMove.exposure) {
        sfx.playInvalid();
        const pos = gridToPixel(cell.r, cell.c);
        spawnFloatingText(LOGICAL_W / 2, pos.y - 24, pinnedMove.exposure.text, '#ff4d4d', 18);
        state.warningLine = {
          from: pinnedMove.exposure.threatPos,
          to: pinnedMove.exposure.kingPos,
          timer: 2.2
        };
        return;
      }
    }

    // (C) 點擊己方棋子 -> 選取並計算合法路徑
    const clickedPiece = state.board[cell.r][cell.c];
    if (clickedPiece && clickedPiece.side === state.turn) {
      state.selected = { r: cell.r, c: cell.c };
      state.legalMoves = getLegalMovesForPiece(state.board, cell.r, cell.c);
      state.blockedMoves = getPinnedBlockedMoves(state.board, cell.r, cell.c);
      state.warningLine = null;
      sfx.playSelect();
    } else if (clickedPiece && clickedPiece.side !== state.turn) {
      // (D) 嚴格禁止選取敵對棋子！若玩家已選己方棋子但該敵棋不在可吃範圍內，保留原己方選取並提示不可吃；若未選己方棋子則完全忽略敵棋點擊
      sfx.playCancel();
      const pos = gridToPixel(cell.r, cell.c);
      if (state.selected) {
        spawnFloatingText(pos.x, pos.y - 24, '此位置目前無法吃子', '#ff8b66', 16);
      } else {
        spawnFloatingText(pos.x, pos.y - 24, '敵方棋子不可選取', '#ff8b66', 16);
      }
    } else if (state.selected) {
      // (E) 點擊空白非合法格 -> 立即取消選取！
      state.selected = null;
      state.legalMoves = [];
      state.blockedMoves = [];
      state.warningLine = null;
      sfx.playCancel();
    }
  });
})();
</script>
